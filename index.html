<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-primary:#FAF9F6;
  --bg-overlay:rgba(0,0,0,0.42);
  --text-primary:#2D3436;
  --text-secondary:#636E72;
  --text-inverse:#FFFFFF;
  --accent:#4A6FA5;
  --accent-dark:#3A5A85;
  --accent-bg:#EDF2F7;
  --emphasis:#E8833A;
  --emphasis-dark:#D9732A;
  --font-sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --leading-relaxed:1.75;
}

html,body{height:100%;overflow:hidden}
body{font-family:var(--font-sans);color:var(--text-primary);background:#0a0a0a}

.bg-wrapper{
  position:fixed;inset:0;z-index:-2;
  overflow:hidden;
}
.bg-wrapper img{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(0.55) saturate(1.1);
}
.bg-overlay{
  position:fixed;inset:0;z-index:-1;
  background:linear-gradient(135deg, rgba(20,25,35,0.55) 0%, rgba(10,15,25,0.40) 100%);
}

.main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;padding:0 clamp(1rem,5vw,3rem);
  animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}

.logo-mark{
  width:72px;height:72px;border-radius:20px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:clamp(1.5rem,3vh,2.5rem);
  border:1px solid rgba(255,255,255,0.18);
}
.logo-mark svg{width:38px;height:38px;fill:none;stroke:white;stroke-width:1.8}

.title{
  font-size:clamp(2rem,5vw,3.2rem);
  font-weight:700;color:var(--text-inverse);
  letter-spacing:0.02em;text-align:center;
  line-height:1.3;margin-bottom:0.5rem;
}
.subtitle{
  font-size:clamp(0.95rem,2vw,1.15rem);
  color:rgba(255,255,255,0.72);
  font-weight:400;text-align:center;
  margin-bottom:clamp(2.5rem,6vh,3.5rem);
  letter-spacing:0.04em;
}
.subtitle span{color:var(--emphasis);font-weight:500}

.entry-group{
  display:flex;gap:clamp(0.75rem,2vw,1.25rem);
  flex-wrap:wrap;justify-content:center;
}

.btn{
  display:inline-flex;align-items:center;gap:0.6rem;
  padding:clamp(0.85rem,1.5vw,1rem) clamp(1.8rem,3vw,2.5rem);
  font-size:clamp(0.95rem,1.5vw,1.08rem);
  font-weight:600;font-family:var(--font-sans);
  border-radius:14px;cursor:pointer;
  transition:all 0.25s cubic-bezier(0.16,1,0.3,1);
  text-decoration:none;position:relative;
  letter-spacing:0.02em;
}
.btn-primary{
  background:var(--accent);
  color:var(--text-inverse);
  border:none;
  box-shadow:0 4px 20px rgba(74,111,165,0.35);
}
.btn-primary:hover{
  background:var(--accent-dark);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(74,111,165,0.45);
}
.btn-primary:active{transform:scale(0.97)}

.btn-outline{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.28);
  color:var(--text-inverse);
}
.btn-outline:hover{
  background:rgba(255,255,255,0.16);
  border-color:rgba(255,255,255,0.45);
  transform:translateY(-2px);
}
.btn-outline:active{transform:scale(0.97)}

.btn svg{width:20px;height:20px;flex-shrink:0}

.footer{
  position:fixed;bottom:clamp(1rem,3vh,2rem);
  left:50%;transform:translateX(-50%);
  font-size:0.8rem;color:rgba(255,255,255,0.38);
  letter-spacing:0.05em;
  animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s both;
}
.footer a{color:rgba(255,255,255,0.5);text-decoration:none;transition:color 0.2s}
.footer a:hover{color:rgba(255,255,255,0.8)}

@media(max-width:480px){
  .entry-group{flex-direction:column;width:100%;max-width:280px}
  .btn{justify-content:center;width:100%}
  .logo-mark{width:56px;height:56px;border-radius:16px}
  .logo-mark svg{width:30px;height:30px}
}
</style>
</head>
